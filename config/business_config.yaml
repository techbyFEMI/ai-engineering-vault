# ─── Demo Business Configuration ─────────────────────────────────────────────
# This file is what you customise per client. No code changes needed.
# Swap this file and restart the server to serve a completely different business.

business:
  name: "Sunshine Properties"
  industry: "real_estate"
  tagline: "Premium Properties in Lagos & Abuja"
  
  # How the agent should sound — this shapes the LLM system prompt
  tone: "professional but warm and approachable"
  
  # Language preference (english / pidgin / mix)
  language: "english"

  # ── Products / Services ──────────────────────────────────────────────────
  products:
    - id: "lekki_3bed"
      name: "3-Bedroom Duplex, Lekki Phase 1"
      description: "Fully finished, 24/7 power, BQ, 2 parking spaces. Ready to move in."
      price_min: 85_000_000
      price_max: 95_000_000
      currency: "NGN"
      available: true

    - id: "ajah_land"
      name: "600sqm Land, Ajah (Survey & C of O)"
      description: "Dry land, all documents complete, accessible road."
      price_min: 12_000_000
      price_max: 15_000_000
      currency: "NGN"
      available: true

  # ── Frequently Asked Questions ────────────────────────────────────────────
  faq:
    - q: "Is the property still available?"
      a: "Yes! We currently have units available. Can I ask — are you looking to buy outright or explore payment plans?"

    - q: "Do you have payment plans?"
      a: "Yes, we offer flexible payment plans up to 12 months with an initial deposit. What's your preferred timeline?"

    - q: "What documents come with the property?"
      a: "All our properties come with a Governor's Consent / C of O, survey plan, and deed of assignment. Everything is clean and registered."

    - q: "Where are you located?"
      a: "Our office is in Victoria Island, Lagos. But we can also arrange a site visit directly. When would work for you?"

  # ── Guardrails ────────────────────────────────────────────────────────────
  guardrails:
    # Phrases the agent must NEVER use
    forbidden_phrases:
      - "I guarantee"
      - "no extra charges"
      - "no legal fees"
      - "100% safe"
      - "promise"

    # Price negotiation rules
    max_discount_percent: 5          # Agent can offer up to 5% off max_price only
    never_go_below_min_price: true   # Hard floor — agent NEVER quotes below price_min

    # Conversation control
    escalate_after_turns: 8          # After 8 back-and-forth turns, hand off to human
    
    # When escalation triggers, notify this WhatsApp number immediately
    escalate_notify_number: "+2348012345678"   # ← Owner's real number

    # Topics the agent should refuse to engage with
    off_topic_refusal: "I'm only able to help with questions about Sunshine Properties. How can I assist you with our listings?"

  # ── Closing Goal ──────────────────────────────────────────────────────────
  # This is the agent's primary sales objective in every conversation
  closing_goal: "Book a site visit appointment OR collect the prospect's full name, phone number, and budget range"
